name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install fastapi uvicorn python-multipart pydantic-settings sqlalchemy chromadb rank-bm25 pypdf python-docx openai numpy pytest httpx
      - run: pytest -q
